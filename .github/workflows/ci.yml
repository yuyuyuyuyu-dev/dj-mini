name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  biome:
    name: Biome
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/biome.yml@main

  kotlin-lint:
    name: Kotlin lint
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/kotlin-lint.yml@main

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the workflow files
        uses: raven-actions/actionlint@v2

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload the lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build-android-test:
    name: Build (androidTest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main

      - name: Build the instrumentation test APK
        run: ./gradlew assembleDebugAndroidTest

  build-release:
    name: Build (release)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main

      - name: Build the release bundle
        run: ./gradlew bundleRelease
